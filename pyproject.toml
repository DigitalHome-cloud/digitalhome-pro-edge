[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalhome-pro-edge"
dynamic = ["version"]
description = "digitalhome.pro"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "D-LAB-5" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
]

# engine.py is standard library only. Flask is the web page's, and mcp
# is the agent server's; every console script below is installed, so
# these are dependencies rather than optional extras.
dependencies = ["flask>=3.0", "mcp>=2,<3", "rdflib>=7.0", "pyshacl>=0.26"]

[project.urls]
Homepage = "https://github.com/DigitalHome-cloud/digitalhome-pro-edge"
Source = "https://github.com/DigitalHome-cloud/digitalhome-pro-edge"
Issues = "https://github.com/DigitalHome-cloud/digitalhome-pro-edge/issues"

[project.scripts]
digitalhome-pro-edge = "digitalhome_pro_edge.engine:main"
digitalhome-pro-edge-web = "digitalhome_pro_edge.app:main"
digitalhome-pro-edge-mcp = "digitalhome_pro_edge.mcp_server:main"
digitalhome-pro-edge-skill = "digitalhome_pro_edge.core.skill_install:main"

[tool.setuptools]
packages = ["digitalhome_pro_edge", "digitalhome_pro_edge.core", "digitalhome_pro_edge.edge", "digitalhome_pro_edge.edge.bridges"]

# Flask resolves templates/ and static/ relative to the module that owns them,
# and core/version.py reads VERSION beside the package, so all of it has to be
# installed alongside the code. skill/ ships so an install can hand the agent
# skill over without the repository. tests/test_core.py checks this list.
[tool.setuptools.package-data]
"digitalhome_pro_edge.edge" = ["static/*", "ontology/*/*.ttl", "ontology/*.ttl"]  # edge layer
digitalhome_pro_edge = ["VERSION", "templates/*.html", "static/*", "skill/*.md", "shared/*.json"]
"digitalhome_pro_edge.core" = ["static/*", "templates/core/*.html"]

[tool.setuptools.dynamic]
version = { file = "digitalhome_pro_edge/VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Use ./test.sh rather than calling pytest directly: a ROS 2 workstation leaks
# pytest plugins in through PYTHONPATH that cannot import here.
